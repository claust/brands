name: CI/CD Pipeline

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master ]

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run linter
        run: npm run lint
        
      - name: Run type checking
        run: npm run typecheck
        
      - name: Format check
        run: npm run format -- --check

  edge-functions-check:
    name: Edge Functions Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          
      - name: Type check Edge Functions
        run: npm run functions:check
        
      - name: Lint Edge Functions
        run: npm run functions:lint

  deploy-edge-functions:
    name: Deploy Supabase Edge Functions
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, edge-functions-check]
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev') && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
          
      - name: Login to Supabase
        run: supabase auth login --token ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        
      - name: Link to Supabase project
        run: supabase projects link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        
      - name: Deploy Edge Functions
        run: supabase functions deploy --no-verify-jwt